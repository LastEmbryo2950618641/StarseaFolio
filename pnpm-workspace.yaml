packages:
  - win/*
  - common/backend
  - common/renderer
  - common/web
  - common/packages/*
  # Expo keeps its own npm install (React Native uses a different React version).
  # See android/mobile/README.md.
# electron-builder → @electron/rebuild@3.x pulls git-hosted @electron/node-gyp.
# Keep false so packaging deps can install under pnpm 11.
blockExoticSubdeps: false
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  electron-winstaller: true
  "@electron/rebuild": true
