appId: com.worldseed.desktop
productName: 星海余页
copyright: Copyright © StarseaFolio
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - build-info.json
asar: true
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**/*"
extraResources:
  - from: ../../packages/prompt-contracts/resources
    to: prompt-contracts/resources
  - from: ../../packages/prompt-contracts/package.json
    to: prompt-contracts/package.json
  - from: build-info.json
    to: build-info.json
win:
  executableName: StarseaFolio
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 星海余页
  uninstallDisplayName: 星海余页
  artifactName: Starsea-Folio-${version}-Setup.${ext}
portable:
  artifactName: Starsea-Folio-${version}-Portable.${ext}
npmRebuild: true
