name: Release Windows

# One publishing lane for every Windows build. Source packages retain the base version.
on:
  workflow_dispatch:
  push:
    branches: [master, dev-0.0.1]
    tags: ["v*.*.*"]

permissions:
  contents: write

# Across branches and manual runs: never let an older build overwrite latest.
concurrency:
  group: windows-release-publisher
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Allocate increasing release number
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { windowsBuildIdentity, nextReleaseBuild } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/release-version.mjs`).href);
            const base = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const identity = windowsBuildIdentity(base, nextReleaseBuild(context.runNumber, releases));
            for (const [key, value] of Object.entries(identity)) core.setOutput(key, value);
            core.setOutput('tag', `v${identity.version}`);
            core.info(`Publishing ${identity.version}`);
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Use hoisted dependencies for electron-builder
        shell: pwsh
        run: Set-Content .npmrc "node-linker=hoisted`nshamefully-hoist=true`nblockExoticSubdeps=false"
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"
      - name: Verify update and packaging rules
        run: corepack pnpm exec vitest run win/desktop/test/app-update.test.ts scripts/packaging/test/release-version.test.mjs
      - name: Package Windows installers
        run: corepack pnpm package:exe
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.buildNumber }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"
      - name: Write update manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUILD_NUMBER: ${{ steps.version.outputs.buildNumber }}
        run: |
          $manifest = [ordered]@{
            version = $env:RELEASE_VERSION
            buildNumber = $env:BUILD_NUMBER
            downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/Starsea-Folio-$env:RELEASE_VERSION-Setup.exe"
            productName = "星海余页 (StarseaFolio)"
          }
          $manifest | ConvertTo-Json | Set-Content "win/desktop/release/latest.json" -Encoding utf8
          $info = Get-Content win/desktop/release/win-unpacked/resources/build-info.json -Raw | ConvertFrom-Json
          if ($info.version -ne $env:RELEASE_VERSION -or $info.buildNumber -ne $env:BUILD_NUMBER) { throw "Packaged identity differs from update manifest" }
      - uses: actions/upload-artifact@v4
        with:
          name: StarseaFolio-Windows-${{ steps.version.outputs.version }}
          path: |
            win/desktop/release/*.exe
            win/desktop/release/*.blockmap
            win/desktop/release/latest.json
          if-no-files-found: error
      # Upload everything to a draft; publish only when all assets exist.
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 星海余页 StarseaFolio ${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          body_path: docs/release-notes.md
          fail_on_unmatched_files: true
          files: |
            win/desktop/release/*.exe
            win/desktop/release/*.blockmap
            win/desktop/release/latest.json
      - name: Publish completed release as latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease=false --latest
