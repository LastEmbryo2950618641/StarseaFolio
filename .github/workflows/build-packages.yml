name: Build EXE and APK

# Build includes publishing: both platforms must succeed before Latest changes.
# The same workflow also deploys the browser app and the web account gate.
on:
  workflow_dispatch:
  push:
    branches: [master, dev-0.0.1]
    tags: ["v*.*.*"]

permissions:
  contents: read

# Share the previous publisher's lane during migration and across branches.
concurrency:
  group: windows-release-publisher
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      buildNumber: ${{ steps.version.outputs.buildNumber }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Allocate increasing release number
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { windowsBuildIdentity, nextReleaseBuild } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/packaging/release-version.mjs`).href);
            const base = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const identity = windowsBuildIdentity(base, nextReleaseBuild(context.runNumber, releases));
            for (const [key, value] of Object.entries(identity)) core.setOutput(key, value);
            core.setOutput('tag', `v${identity.version}`);
            core.info(`Publishing ${identity.version}`);

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Use hoisted dependencies for electron-builder
        shell: pwsh
        run: Set-Content .npmrc "node-linker=hoisted`nshamefully-hoist=true`nblockExoticSubdeps=false"
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"
      - name: Verify update and packaging rules
        run: corepack pnpm exec vitest run win/desktop/test/app-update.test.ts win/desktop/test/app-update-network.test.ts common/renderer/test/app-update-schedule.test.ts scripts/packaging/test/release-version.test.mjs
      - name: Package Windows installers
        run: corepack pnpm package:exe
        env:
          BUILD_NUMBER: ${{ needs.version.outputs.buildNumber }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          npm_config_msvs_version: "2022"
          GYP_MSVS_VERSION: "2022"
      - name: Write update manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          BUILD_NUMBER: ${{ needs.version.outputs.buildNumber }}
        run: |
          $manifest = [ordered]@{
            version = $env:RELEASE_VERSION
            buildNumber = $env:BUILD_NUMBER
            downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/Starsea-Folio-$env:RELEASE_VERSION-Setup.exe"
            productName = "星海余页 (StarseaFolio)"
          }
          $manifest | ConvertTo-Json | Set-Content "win/desktop/release/latest.json" -Encoding utf8
          $info = Get-Content win/desktop/release/win-unpacked/resources/build-info.json -Raw | ConvertFrom-Json
          if ($info.version -ne $env:RELEASE_VERSION -or $info.buildNumber -ne $env:BUILD_NUMBER) { throw "Packaged identity differs from update manifest" }
      - uses: actions/upload-artifact@v4
        with:
          name: StarseaFolio-Windows-${{ needs.version.outputs.version }}
          path: |
            win/desktop/release/*.exe
            win/desktop/release/*.blockmap
            win/desktop/release/latest.json
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Android dependencies
        run: npm --prefix android/mobile ci --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('android/mobile/package-lock.json', 'android/mobile/app.json', 'android/mobile/plugins/**') }}
      - name: Package APK
        run: corepack pnpm package:apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarseaFolio-Android-preview-${{ needs.version.outputs.version }}
          path: android/mobile/release/*.apk
          if-no-files-found: error

  publish:
    needs: [version, windows, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: StarseaFolio-Windows-${{ needs.version.outputs.version }}
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: StarseaFolio-Android-preview-${{ needs.version.outputs.version }}
          path: release/android
      # Upload everything to a draft; publish only when all assets exist.
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 星海余页 StarseaFolio ${{ needs.version.outputs.version }}
          draft: true
          prerelease: false
          body_path: docs/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/windows/*.exe
            release/windows/*.blockmap
            release/windows/latest.json
            release/android/*.apk
      - name: Publish completed release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest

  deploy-web:
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: corepack pnpm install --frozen-lockfile
      - name: Build browser app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
          STARSEA_WEB_BASE: /StarseaFolio/
        run: |
          corepack pnpm --filter @starseafolio/contracts build
          corepack pnpm --filter @starseafolio/config build
          corepack pnpm --filter @starseafolio/web build
      - name: Deploy browser app
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: 111.229.32.85
          DEPLOY_USER: liuqi
          DEPLOY_PATH: /data/disk/starseafolio/StarseaFolio
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY is not configured"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          tar -C common/web/dist -czf /tmp/starsea-web.tgz .
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes /tmp/starsea-web.tgz "$DEPLOY_USER@$DEPLOY_HOST:/data/disk/starseafolio/starsea-web.tgz"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$DEPLOY_PATH'/assets '$DEPLOY_PATH'/index.html && tar -xzf /data/disk/starseafolio/starsea-web.tgz -C '$DEPLOY_PATH' && rm -f /data/disk/starseafolio/starsea-web.tgz && find '$DEPLOY_PATH' -type d -exec chmod 755 {} + && find '$DEPLOY_PATH' -type f -exec chmod 644 {} +"
          tar -C common/web/server -czf /tmp/starsea-gate.tgz .
          scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes /tmp/starsea-gate.tgz "$DEPLOY_USER@$DEPLOY_HOST:/data/disk/starseafolio/starsea-gate.tgz"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf /tmp/starsea-gate-src && mkdir -p /tmp/starsea-gate-src && tar -xzf /data/disk/starseafolio/starsea-gate.tgz -C /tmp/starsea-gate-src && rm -f /data/disk/starseafolio/starsea-gate.tgz && sudo bash /tmp/starsea-gate-src/remote-install.sh && rm -rf /tmp/starsea-gate-src"
