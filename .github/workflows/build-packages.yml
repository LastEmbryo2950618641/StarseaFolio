name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master, dev-0.0.1]

permissions:
  contents: read

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Use HTTPS for public Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install Android dependencies
        run: npm --prefix android/mobile ci --no-audit --no-fund
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('android/mobile/package-lock.json', 'android/mobile/app.json', 'android/mobile/plugins/**') }}
      - name: Package APK
        run: corepack pnpm package:apk
      - uses: actions/upload-artifact@v4
        with:
          name: StarseaFolio-Android-preview-${{ github.run_number }}
          path: android/mobile/release/*.apk
          if-no-files-found: error
